name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER_LINE=$(java -version 2>&1 | head -n 1)
          echo "Detected Java version line: $JAVA_VER_LINE"
          RAW_VER=$(echo "$JAVA_VER_LINE" | sed -n 's/.*version "\([^"]*\)".*/\1/p')
          if [ -z "$RAW_VER" ]; then
            echo "ERROR: Could not detect active Java version."
            exit 1
          fi
          MAJOR_VER=$(echo "$RAW_VER" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to parse Java major version from '$RAW_VER'."
            exit 1
          fi
          echo "Active Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but found Java $MAJOR_VER."
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="keytool"
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Temporary ./debug.keystore could not be created."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ] || [[ "$APK_PATH" != *.apk ]]; then
            echo "ERROR: Expected APK not found or invalid at: $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          echo "Verified APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SRC_APK" ] || [ ! -s "$SRC_APK" ]; then
            echo "ERROR: Source APK is missing or empty: $SRC_APK"
            exit 1
          fi
          TMP_RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")"
          DEST_APK="${TMP_RELEASE_DIR}/app-debug.apk"
          cp "$SRC_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Failed to prepare release asset at $DEST_APK"
            exit 1
          fi
          echo "apk_path=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_APK: ${{ steps.prepare_release_asset.outputs.apk_path }}
        run: |
          gh --version
          if [ -z "$PREPARED_APK" ] || [ ! -f "$PREPARED_APK" ] || [ ! -s "$PREPARED_APK" ]; then
            echo "ERROR: Prepared release APK does not exist or is empty."
            exit 1
          fi
          if [[ "$PREPARED_APK" != *.apk ]] || [ "$(basename "$PREPARED_APK")" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly app-debug.apk."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Purpose:** Intended for testing only (not a Google Play Store production release).
          - **Signing:** Signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" \
            "$PREPARED_APK" \
            --target "${GITHUB_SHA}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: ${{ steps.verify_apk.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG" --json tagName,name,url,assets
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: $DIRECT_URL"
            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_URL"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** Debug APK Build #${GITHUB_RUN_NUMBER}"
              echo "- **Release Page:** $RELEASE_URL"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Artifact:** \`app-debug-apk\` remains available in GitHub Actions artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed, so the new APK is NOT available via the latest-release direct link."
            echo "The debug APK build succeeded and the backup GitHub Actions artifact 'app-debug-apk' remains available."
            {
              echo "## Release Publishing Failed"
              echo ""
              echo "The debug APK build succeeded and the backup GitHub Actions artifact \`app-debug-apk\` remains available."
              echo "Warning: GitHub Release publishing failed; do not expect this build at the latest-release direct URL."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
